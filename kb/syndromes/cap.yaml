id: cap
version: 3
source: idsa-ats-2019
section: 'Scope: adults, outpatient and inpatient CAP'
source_date: '2019-10-01'
reviewed_at: null
review_status: unreviewed
note: 'Baseline patient: healthy 70 kg adult with normal renal function. Severe CAP is derived from the 2007 IDSA/ATS
  criteria (1 major or at least 3 minor), not from the ICU location (IDSA/ATS 2019; TTD 2021 Table 6).'
pathogens:
- s_pneumoniae
- h_influenzae
- m_catarrhalis
- m_pneumoniae
- c_pneumoniae
- legionella
- mssa
- mrsa
- p_aeruginosa
- enterobacterales
- anaerobes
- influenza
questions:
- setting
- severe_vasopressor
- severe_ventilation
- severe_minor
- comorbidity
- recent_hosp_iv
- prior_mrsa
- prior_pseudomonas
- pen_allergy
- pregnancy
- renal
- qt_risk
- aspiration
- influenza
- recent_abx_class
- macrolide_resistance
derived:
- id: severe
  when:
    any:
    - question: severe_vasopressor
      eq: 'yes'
    - question: severe_ventilation
      eq: 'yes'
    - question: severe_minor
      eq: ge3
- id: comorbid
  when:
    not:
      question: comorbidity
      empty: true
- id: risk_mrsa
  risk: mrsa
  pathogen: mrsa
  when:
    any:
    - question: prior_mrsa
      eq: 'yes'
    - all:
      - question: recent_hosp_iv
        eq: 'yes'
      - question: severe
        eq: 'yes'
- id: risk_pseudomonas
  risk: pseudomonas
  pathogen: p_aeruginosa
  when:
    any:
    - question: prior_pseudomonas
      eq: 'yes'
    - all:
      - question: recent_hosp_iv
        eq: 'yes'
      - question: severe
        eq: 'yes'
