- id: allergy_scar_beta_lactam
  version: 2
  source: aaaai-acaai-2022
  section: Drug allergy practice parameter 2022, severe cutaneous adverse reactions (beta-lactam avoidance)
  source_date: '2022-12-01'
  reviewed_at: null
  review_status: unreviewed
  note: Severe cutaneous reaction to a penicillin; every beta-lactam is withheld.
  when:
    question: pen_allergy
    eq: scar
  exclude:
    class_group:
    - beta_lactam
  reason_key: exclude.allergy_scar
- id: allergy_ige_penicillin
  version: 1
  source: zagursky-2018
  section: Beta-lactam cross-reactivity by side chain
  source_date: '2018-01-01'
  reviewed_at: null
  review_status: unreviewed
  when:
    question: pen_allergy
    eq: ige
  exclude:
    beta_lactam_core:
    - penicillin
  reason_key: exclude.allergy_ige
- id: allergy_ige_side_chain
  version: 1
  source: zagursky-2018
  section: Beta-lactam cross-reactivity by side chain
  source_date: '2018-01-01'
  reviewed_at: null
  review_status: unreviewed
  note: Other beta-lactams stay allowed unless their R1 side chain matches a penicillin.
  when:
    question: pen_allergy
    eq: ige
  exclude:
    shares_r1_with_core:
    - penicillin
  reason_key: exclude.allergy_side_chain
- id: allergy_ige_other_beta_lactam
  version: 1
  source: aaaai-acaai-2022
  section: Drug allergy practice parameter 2022, cephalosporin and carbapenem use in penicillin allergy
  source_date: '2022-12-01'
  reviewed_at: null
  review_status: unreviewed
  note: Third and fourth generation cephalosporins, carbapenems and aztreonam with a dissimilar side chain may be given without testing; the line carries a warning so the allergy stays visible.
  mode: warn
  when:
    question: pen_allergy
    eq: ige
  exclude:
    class_group:
    - beta_lactam
  reason_key: warn.allergy_ige_other_beta_lactam
- id: allergy_delayed_penicillin
  version: 1
  source: zagursky-2018
  section: Beta-lactam cross-reactivity by side chain
  source_date: '2018-01-01'
  reviewed_at: null
  review_status: unreviewed
  when:
    question: pen_allergy
    eq: delayed
  exclude:
    beta_lactam_core:
    - penicillin
  reason_key: exclude.allergy_delayed
- id: pregnancy_avoid
  version: 1
  source: product-labels
  section: SmPC 4.6 (pregnancy)
  source_date: '2024-01-01'
  reviewed_at: null
  review_status: unreviewed
  when:
    question: pregnancy
    eq: 'yes'
  exclude:
    pregnancy:
    - avoid
  reason_key: exclude.pregnancy
- id: qt_known_risk
  version: 1
  source: credible-meds
  section: QT-prolonging drug list (known risk)
  source_date: '2024-01-01'
  reviewed_at: null
  review_status: unreviewed
  when:
    question: qt_risk
    eq: 'yes'
  exclude:
    qt_risk:
    - known
  reason_key: exclude.qt
- id: recent_same_class
  version: 2
  source: ttd-2021
  section: Table 5 (antibiotic use in the last 3 months); IDSA/ATS 2019 Q7
  source_date: '2021-01-01'
  reviewed_at: null
  review_status: unreviewed
  note: Soft rule. A same-tier candidate of another class moves ahead; when none exists the candidate stays with a warning. The beta-lactam backbone of inpatient and severe regimens is never demoted. The class grouping is a draft.
  mode: demote
  spare:
    role: beta_lactam
    when:
      any:
      - question: setting
        in:
        - ward
        - icu
      - question: severe
        eq: 'yes'
  when:
    not:
      question: recent_abx_class
      empty: true
  exclude:
    class_group_in_answer: recent_abx_class
  reason_key: warn.recent_class
- id: macrolide_monotherapy_resistance
  version: 1
  source: idsa-ats-2019
  section: Q7
  source_date: '2019-10-01'
  reviewed_at: null
  review_status: unreviewed
  when:
    question: macrolide_resistance
    eq: ge25
  exclude:
    class_group:
    - macrolide
    monotherapy: true
  reason_key: exclude.macrolide_resistance
- id: not_licensed
  version: 1
  source: abxpilot-draft
  section: Region licensing list
  source_date: '2026-09-24'
  reviewed_at: null
  review_status: unreviewed
  exclude:
    license:
    - not_licensed
  reason_key: exclude.not_licensed
- id: license_unknown
  version: 1
  source: titck-2026
  section: Region licensing list
  source_date: '2026-09-18'
  reviewed_at: null
  review_status: unreviewed
  note: A drug missing from the region licensing list is kept; the line tells the prescriber to check availability.
  mode: warn
  exclude:
    license:
    - unknown
  reason_key: warn.license_unknown
- id: pyelonephritis_urinary_agents
  version: 1
  source: idsa-cuti-2025
  section: Table 1.1 footnote; EAU 2026 section 3.6.3
  source_date: '2025-07-17'
  reviewed_at: null
  review_status: unreviewed
  note: Nitrofurantoin, oral fosfomycin and pivmecillinam reach too little tissue level for a systemic urinary infection.
  when:
    question: uti_site
    eq: systemic
  exclude:
    drug:
    - nitrofurantoin
    - fosfomycin
    - pivmecillinam
  reason_key: exclude.urinary_agent_systemic
- id: tmp_smx_resistance
  version: 1
  source: idsa-uti-2011
  section: Recommendation 2; EAU 2026 Table 3
  source_date: '2011-03-01'
  reviewed_at: null
  review_status: unreviewed
  when:
    question: local_tmp_smx_resistance
    eq: ge20
  exclude:
    class_group:
    - folate_antagonist
  reason_key: exclude.tmp_smx_resistance
- id: uti_recent_fq_6m
  version: 1
  source: eau-uti-2026
  section: Section 3.7.3 (fluoroquinolone in the last 6 months)
  source_date: '2026-01-01'
  reviewed_at: null
  review_status: unreviewed
  when:
    question: uti_recent_fq
    eq: within_6m
  exclude:
