    - fluoroquinolone
  reason_key: exclude.recent_fq
- id: uti_recent_fq_12m
  version: 1
  source: idsa-cuti-2025
  section: Step 2-II (resistant organism risk, 12 months)
  source_date: '2025-07-17'
  reviewed_at: null
  review_status: unreviewed
  mode: warn
  when:
    question: uti_recent_fq
    eq: from_6_to_12m
  exclude:
    class_group:
    - fluoroquinolone
  reason_key: warn.recent_fq
- id: iai_fq_resistance
  version: 1
  source: sis-idsa-2010
  section: Recommendation 39; EKMUD 2016 item 28
  source_date: '2010-01-15'
  reviewed_at: null
  review_status: unreviewed
  note: 'Soft rule: quinolones move back in their tier when local E. coli resistance is 10% or more.'
  mode: demote
  when:
    all:
    - question: local_fq_resistance
      eq: ge10
    - question: iai_acquisition
      in:
      - community
      - healthcare
  exclude:
    class_group:
    - fluoroquinolone
  reason_key: warn.iai_fq_resistance
- id: renal_nitrofurantoin
  version: 1
  source: label-nitrofurantoin
  section: Contraindications
  source_date: '2025-10-14'
  reviewed_at: null
  review_status: unreviewed
  note: Label contraindicates creatinine clearance under 60 mL/min.
  when:
    question: renal
    in:
    - crcl_30_59
    - crcl_15_29
    - crcl_lt15
    - hemodialysis
    - crrt
  exclude:
    drug:
    - nitrofurantoin
  reason_key: exclude.renal
