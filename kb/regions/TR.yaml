resistance:
- id: spn_macrolide
  version: 2
  source: who-caesar
  section: Turkey country page p.137 (invasive S. pneumoniae, macrolide resistant)
  source_date: '2021-12-31'
  reviewed_at: null
  review_status: unreviewed
  note: 34.1% in 2021 (n=126), 34.5-39.5% in 2016-2020. Invasive isolates, not CAP-specific; SOAR 2015-17 outpatient
    isolates and TTD 2021 (33-51%) agree with the ge25 category.
  pathogen: s_pneumoniae
  drug_class: macrolide
  category: ge25
  estimate: 0.341
- id: sau_methicillin
  version: 2
  source: who-caesar
  section: Turkey country page p.137 (invasive S. aureus, methicillin resistant)
  source_date: '2021-12-31'
  reviewed_at: null
  review_status: unreviewed
  note: 30.7% of invasive isolates in 2021 (n=3562). Information only, never a trigger - MRSA in CAP is far rarer, and
    empiric MRSA cover follows the IDSA/ATS 2019 Q10 risk factors (prior respiratory isolation; recent hospitalisation
    with IV antibiotics in severe CAP).
  pathogen: mrsa
  drug_class: beta_lactam
  category: ge25
  estimate: 0.307
- id: eco_tmp_smx
  version: 1
  source: cinislioglu-2024
  section: Uncomplicated UTI, 37 centres, 1503 E. coli isolates, March 2021 - August 2022
  source_date: '2024-10-01'
  reviewed_at: null
  review_status: unreviewed
  note: 26.9% resistant.
  pathogen: e_coli
  drug_class: folate_antagonist
  category: ge20
  estimate: 0.269
- id: eco_fq
  version: 1
  source: cinislioglu-2024
  section: Uncomplicated UTI, 37 centres, 1503 E. coli isolates, March 2021 - August 2022
  source_date: '2024-10-01'
  reviewed_at: null
  review_status: unreviewed
  note: Ciprofloxacin 37.4% resistant. Outpatient urinary isolates; used for IAI too, where EKMUD 2016 item 28 reports 54%
    quinolone susceptibility.
  pathogen: e_coli
  drug_class: fluoroquinolone
  category: ge10
  estimate: 0.374
- id: eco_esbl
  version: 1
  source: cinislioglu-2024
  section: Uncomplicated UTI, 37 centres, 1503 E. coli isolates, March 2021 - August 2022
  source_date: '2024-10-01'
  reviewed_at: null
  review_status: unreviewed
  note: ESBL 14.3%. Nitrofurantoin 14.4% and fosfomycin 13.3% resistant. Urinary isolates stand in for the community IAI rate.
  pathogen: e_coli
  drug_class: cephalosporin
  category: ge10
  estimate: 0.143
