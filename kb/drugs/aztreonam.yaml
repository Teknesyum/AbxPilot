id: aztreonam
version: 3
source: product-labels
section: SmPC 4.3-4.8 (contraindications, interactions, pregnancy, adverse effects)
source_date: '2024-01-01'
reviewed_at: null
review_status: unreviewed
note: AWaRe group recorded from memory; check against the 2023 list in A9.
class: monobactam
class_group: beta_lactam
aware: reserve
routes:
- iv
- im
oral_bioavailability: none
beta_lactam:
  core: monobactam
  r1_group: ceftazidime_aztreonam
  r1_similar: []
doses:
- id: cap_iv
  indication: cap
  route: iv
  renal_band: normal
  amount: 2 g
  interval_hours: 8
  source: idsa-ats-2019
  section: Q10; Table 3
- id: cap_iv
  indication: cap
  route: iv
  renal_band: crcl_15_29
  amount: 1 g
  loading: 2 g
  interval_hours: 8
  source: label-aztreonam
  section: 'US PI Dosage and Administration, Renal Impairment in Adult Patients'
  note: 'Label: halve the dose when CrCl 10-30 mL/min/1.73 m2, after the usual initial dose.'
- id: cap_iv
  indication: cap
  route: iv
  renal_band: crcl_lt15
  amount: 500 mg
  loading: 2 g
  interval_hours: 8
  source: label-aztreonam
  section: 'US PI Dosage and Administration, Renal Impairment in Adult Patients'
  note: 'Label: CrCl <10 mL/min/1.73 m2, maintenance one-fourth of the initial dose at the usual interval.'
- id: cap_iv
  indication: cap
  route: iv
  renal_band: hemodialysis
  amount: 500 mg
  loading: 2 g
  interval_hours: 8
  source: label-aztreonam
  section: 'US PI Dosage and Administration, Renal Impairment in Adult Patients'
  note: 'Label: maintenance one-fourth of the initial dose; in serious infection also give one-eighth of the initial dose (250 mg) after each hemodialysis session.'
- id: iai_iv
  indication: iai
  route: iv
  renal_band: normal
  amount: 1-2 g
  interval_hours: 8
  source: sis-idsa-2010
  section: Table 6
  note: Table 6 gives every 6-8 h.
- id: iai_iv
  indication: iai
  route: iv
  renal_band: crcl_15_29
  amount: 0.5-1 g
  loading: 1-2 g
  interval_hours: 8
  source: label-aztreonam
  section: 'US PI Dosage and Administration, Renal Impairment in Adult Patients'
  note: 'Label: halve the dose when CrCl 10-30 mL/min/1.73 m2, after the usual initial dose.'
- id: iai_iv
  indication: iai
  route: iv
  renal_band: crcl_lt15
  amount: 250-500 mg
  loading: 1-2 g
  interval_hours: 8
  source: label-aztreonam
  section: 'US PI Dosage and Administration, Renal Impairment in Adult Patients'
  note: 'Label: CrCl <10 mL/min/1.73 m2, maintenance one-fourth of the initial dose at the usual interval.'
- id: iai_iv
  indication: iai
  route: iv
  renal_band: hemodialysis
  amount: 250-500 mg
  loading: 1-2 g
  interval_hours: 8
  source: label-aztreonam
  section: 'US PI Dosage and Administration, Renal Impairment in Adult Patients'
  note: 'Label: maintenance one-fourth of the initial dose; in serious infection also give one-eighth of the initial dose (125-250 mg) after each hemodialysis session.'
