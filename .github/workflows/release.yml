name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json

      - name: Test
        run: dotnet test tests/AbxPilot.Tests/AbxPilot.Tests.csproj -c Release

      - name: Publish
        run: dotnet publish src/AbxPilot.Desktop/AbxPilot.Desktop.csproj -c Release -r win-x64 --self-contained true -o yayin -p:PublishSingleFile=false

      - name: Package
        id: pkg
        run: |
          $tag = "${{ github.ref_name }}"
          $zip = "AbxPilot-win-x64-$tag.zip"
          if (-not (Test-Path yayin/AbxPilot.exe)) { throw "AbxPilot.exe missing from publish output" }
          Compress-Archive -Path yayin/* -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$zip.sha256", "$hash  $zip`n")
          Get-Content "$zip.sha256"
          "zip=$zip" >> $env:GITHUB_OUTPUT

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $zip = "${{ steps.pkg.outputs.zip }}"
          $ghArgs = @($tag, $zip, "$zip.sha256", "Kur.bat", "kur-abxpilot.ps1", "--title", "AbxPilot $tag", "--verify-tag")
          if ($tag.Contains("-")) {
            $note = "Önizleme — klinik kullanım için değildir; uzman incelemesi bekleniyor.`n`nPreview — not for clinical use; pending expert review."
            $ghArgs += @("--prerelease", "--notes", $note)
          } else {
            $ghArgs += @("--generate-notes")
          }
          gh release create @ghArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
